name: Windows release gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-install-and-repair:
    name: ${{ matrix.runner }} clean install and repair
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2022
          - windows-2025
          - windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PYTHONNOUSERSITE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build the committed nine-file ZIP and test predownload failures
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'Screen Color Changer.pyw') -Raw
          $match = [regex]::Match($source, '(?m)^APP_VERSION = "(?<version>\d+\.\d+\.\d+)"\s*$')
          if (-not $match.Success) { throw 'The app has no unambiguous release version.' }
          $archive = Join-Path $env:RUNNER_TEMP ('Screen-Color-Changer-v' + $match.Groups['version'].Value + '.zip')
          $release = Join-Path $env:RUNNER_TEMP 'Color release space'
          if ($release.Length -gt 72) { throw 'The test release path exceeds the supported limit.' }
          # The builder reads HEAD blobs and verifies the exact nine-file ZIP.
          # No installed runtime, user settings, or recovery record is packaged.
          & ./scripts/Build-ReleaseZip.ps1 -OutputPath $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $release
          & ./scripts/Test-ReleasePreflight.ps1 -ReleaseRoot $release
          Write-Host ('Canonical ZIP SHA-256: ' + (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash)

      - name: Perform clean private setup from the exact ZIP through the confirmation prompt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:RUNNER_TEMP 'Color release space'
          Push-Location -LiteralPath $release
          try {
            & $env:ComSpec /d /c 'echo Y| call "Installer.bat" --no-pause'
            if ($LASTEXITCODE -ne 0) { throw "Clean setup failed with exit code $LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Verify repair, shortcut readback, and display-safe offline self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:RUNNER_TEMP 'Color release space'
          Push-Location -LiteralPath $release
          try {
            & $env:ComSpec /d /c 'call "Installer.bat" --yes --no-pause'
            if ($LASTEXITCODE -ne 0) { throw "Repair failed with exit code $LASTEXITCODE" }
          } finally { Pop-Location }
          $shortcutPath = Join-Path $release 'Screen Color Changer.lnk'
          if (-not (Test-Path -LiteralPath $shortcutPath -PathType Leaf)) { throw 'The folder-local shortcut is missing.' }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($shortcutPath)
          $runtime = Join-Path $release '.runtime\python'
          $expectedTarget = Join-Path $runtime 'pythonw.exe'
          $expectedArguments = '-I "' + (Join-Path $release 'Screen Color Changer.pyw') + '"'
          if ([IO.Path]::GetFullPath($shortcut.TargetPath).TrimEnd('\') -ine [IO.Path]::GetFullPath($expectedTarget).TrimEnd('\') -or $shortcut.Arguments -cne $expectedArguments -or [IO.Path]::GetFullPath($shortcut.WorkingDirectory).TrimEnd('\') -ine [IO.Path]::GetFullPath($release).TrimEnd('\') -or [int]$shortcut.WindowStyle -ne 1 -or $shortcut.Description -cne 'Screen Color Changer' -or $shortcut.Hotkey) {
            throw 'The release shortcut does not preserve its expected isolated private-app contract.'
          }
          $checks = Join-Path $env:RUNNER_TEMP 'color-offline-checks'
          New-Item -ItemType Directory -Path $checks -ErrorAction Stop | Out-Null
          # --self-test injects fake color effects and offscreen Qt. Never start
          # the shortcut or the normal app entry point on a hosted runner.
          & (Join-Path $runtime 'python.exe') -I -B (Join-Path $release 'Screen Color Changer.pyw') --self-test $checks
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath (Join-Path $checks 'self-test-passed.txt') -PathType Leaf)) {
            throw 'The display-safe offline self-test did not pass.'
          }
          Write-Host 'Repair, shortcut readback, and fake-display self-test passed. Native GPU filtering was not tested.'

      - name: Run source regressions with the extracted private runtime and fake displays
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Join-Path $env:RUNNER_TEMP 'Color release space'
          $python = Join-Path $release '.runtime\python\python.exe'
          # Test modules inject FakeMagnification/FakeGammaApi/FakeEffect and
          # disposable settings/recovery paths. IPC/startup checks use private
          # named pipes/mutexes, not a native color session or real UI automation.
          $code = @'
          import os, sys, unittest
          from pathlib import Path
          os.environ['QT_QPA_PLATFORM'] = 'offscreen'
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          tests = root / 'tests'
          sys.path[:0] = [str(root), str(tests)]
          suite = unittest.defaultTestLoader.discover(str(tests), pattern='test_*.py')
          if suite.countTestCases() == 0:
              raise SystemExit('No fake-display regression tests were discovered.')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          '@
          & $python -I -B -c $code
          if ($LASTEXITCODE -ne 0) { throw 'Fake-display/offscreen source regressions failed.' }

      - name: Upload diagnostics if a gate fails
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: setup-diagnostics-${{ matrix.runner }}-${{ github.run_id }}
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
          path: |
            ${{ runner.temp }}/Color release space/setup.log
            ${{ runner.temp }}/Color release space/.runtime/error.log
            ${{ runner.temp }}/Color release space/.runtime/logs/*.log
            ${{ runner.temp }}/color-offline-checks/self-test-passed.txt
